<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>화면 목록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body data-page="index" data-title="화면 목록">
<div class="app">
  <div id="sidebar"></div>
  <div class="main">
    <div class="topbar"><div class="crumb"><b>화면 목록</b></div></div>
    <div class="content">
      <div class="page-head">
        <h2 id="h">스토리보드 프로토타입 · 화면 목록</h2>
        <button class="btn" id="reset">목업 데이터 초기화</button>
      </div>
      <div class="banner info">스토리보드 md 문서를 기준으로 만든 클릭 가능한 HTML 프로토타입입니다. 목업 기준일은 2026.11.07이며, 화면에서 바꾼 값은 이 브라우저에만 저장됩니다. 왼쪽 아래 '프로토타입 보기 역할'로 역할별 화면 차이를 확인할 수 있습니다.</div>
      <div class="hub-grid" id="hub"></div>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
UI.page(function () {
  var $ = UI.$, esc = UI.esc;
  $('#h').textContent = (UI.PORTAL === 'leader' ? '리더어드바이저' : '상담어드바이저') + ' 스토리보드 프로토타입 · 화면 목록';
  var ALL = '전체 역할', ADM = '관리자', LA = '리더·관리자';
  var cards = [
    ['monitoring.html', '실시간 상태 모니터링', '업무 · 리더어드바이저', '이슈 콜 인입 추이(오늘 시간대별, 전일 비교)와 처리 단계별 상태(미처리·검토필요·처리완료·이슈없음, 기한 초과)', LA, true],
    ['history-list.html', '상담이력 목록', '업무 · 상담이력 조회', '다중 필터(기간·센터·팀·사번·통화시간·재인입·키워드 유형+키워드), 컬럼별 정렬, 페이지 크기 10/20/50', ALL],
    ['history-detail.html?id=CL-20261107-0031', '상담이력 상세', '업무 · 상담이력 조회', '콜 기본 정보, 녹취 재생 연계, 전사 텍스트, 분류 결과(대>중>소>세), 추출 키워드, 이상 지표, 이슈 처리 영역', ALL],
    ['issue-list.html', '이슈 콜 목록', '업무 · 상담이력 조회', '다중 검색, 상태 관리, 이슈 기한(일/주/월/연, 달력 기준), 담당 관리자 지정, 일괄 처리, 처리 내역', ALL],
    ['issue-settings.html', '이슈 콜 설정', '업무 · 리더어드바이저', '이슈 유형 추가·수정·삭제, 기본 이슈 기한, 개선 제안, 담당자, 상담사 공개 범위(본인/센터/전체)', LA, true],
    ['keyword.html', '키워드 관리', '업무', '상품 탭(포털 → 기간계 전송, 연관 키워드), 리스크·제외 키워드·추가한 유형 탭, 엑셀 일괄 등록, 유형 추가', LA],
    ['call-stats.html', '콜 통계', '업무 · 관리자 화면', '전체·재인입·이슈 콜, 평균 통화·묵음시간, 이슈 콜 처리 현황(처리율·평균 처리 기간·기한 초과·기한 내 처리율)', ADM],
    ['notice.html', '공지사항', '공통', '목록·상세 열람, 관리자 등록·수정·삭제', ALL],
    ['users.html', '사용자 관리', '공통', '사용자 조회·등록·수정, 역할 지정, 계정 상태 변경, 잠금 해제', ADM],
    ['roles.html', '역할 관리', '공통', '역할 등록·수정·삭제, 메뉴별 조회·편집 권한, 데이터 조회 범위', ADM],
    ['audit.html', '감사로그', '공통', '작업 기록 조회(기간·사용자·작업 유형·메뉴·결과 필터), 상세 모달', ADM]
  ];
  $('#hub').innerHTML = cards.filter(function (c) { return !c[5] || UI.PORTAL === 'leader'; }).map(function (c) {
    return '<a class="hub-card" href="' + c[0] + '"><span class="hc-m">' + esc(c[2]) + '</span><span class="hc-t">' + esc(c[1]) + '</span><span class="hc-d">' + esc(c[3]) + '</span><span class="hint" style="margin:0">접근: ' + esc(c[4]) + '</span></a>';
  }).join('');
  $('#reset').addEventListener('click', function () {
    UI.dialog({ title: '목업 데이터를 초기화하시겠습니까?', desc: '화면에서 바꾼 이슈 처리·키워드·설정·공지사항·사용자·역할 값을 처음 상태로 되돌립니다.', ok: '초기화', danger: true, onOk: function () {
      Object.keys(localStorage).filter(function (k) { return k.indexOf('daishin-advisor-proto:') === 0 && k.indexOf(':role-') < 0; }).forEach(function (k) { localStorage.removeItem(k); });
      UI.flash('목업 데이터를 초기화했습니다.'); location.reload();
    } });
  });
});
</script>
</body>
</html>
