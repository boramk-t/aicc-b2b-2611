<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>사용자 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body data-page="users" data-title="사용자 관리">
<div class="app">
  <div id="sidebar"></div>
  <div class="main">
    <div class="topbar"><div class="crumb"><b>사용자 관리</b></div></div>
    <div class="content">
      <div class="page-head"><h2>사용자 관리</h2></div>
      <div class="banner info">사용자는 삭제하지 않고 계정 상태를 '미사용'으로 바꿉니다. 인증 방식(SSO·AD 연동 또는 자체 계정)에 따라 등록 방식이 바뀔 수 있습니다. (확인 필요)</div>
      <div class="filter-bar" id="filters">
        <div class="filter-grid">
          <div class="fld"><label>센터</label><div class="ms" id="f-center" data-options="서울센터|부산센터"></div></div>
          <div class="fld"><label>팀</label><div class="ms" id="f-team" data-options=""></div></div>
          <div class="fld"><label>역할</label><div class="ms" id="f-role" data-options=""></div></div>
          <div class="fld"><label>계정 상태</label><div class="ms" id="f-st" data-options="사용|잠금|미사용"></div></div>
          <div class="fld span2"><label for="f-q">검색어</label><input class="inp-s" id="f-q" placeholder="사번 또는 이름 (부분 일치)"></div>
        </div>
        <div class="filter-actions"><button class="btn" id="btn-reset">초기화</button><button class="btn pri" id="btn-search">검색</button></div>
      </div>
      <div class="list-wrap">
        <div class="list-head">
          <div class="left"><b id="total" style="color:#0F172A">총 0건</b></div>
          <div class="right"><button class="btn xs pri" id="add">사용자 등록</button><label class="hint" for="size" style="margin:0 0 0 8px">페이지 크기</label><select class="sel" id="size"><option>10</option><option selected>20</option><option>50</option></select></div>
        </div>
        <table class="data" id="tbl">
          <thead><tr><th class="sortable" data-default="asc">사번</th><th class="sortable">이름</th><th class="sortable">센터</th><th class="sortable">팀</th><th class="sortable">역할</th><th class="sortable">계정 상태</th><th class="sortable">마지막 로그인</th><th>관리</th></tr></thead>
          <tbody></tbody>
        </table>
        <div class="pager" id="pager"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="m-user" hidden>
  <div class="modal md">
    <h3 id="mu-title">사용자 등록</h3>
    <div class="note" id="mu-self" hidden>본인의 역할과 계정 상태는 바꿀 수 없습니다.</div>
    <div class="form" style="margin-top:8px">
      <div class="grid2">
        <div class="fld"><label class="req" for="mu-emp">사번</label><input class="inp-s" id="mu-emp" placeholder="사번을 입력해 주세요."></div>
        <div class="fld"><label class="req" for="mu-name">이름</label><input class="inp-s" id="mu-name" placeholder="이름을 입력해 주세요."></div>
        <div class="fld"><label class="req" for="mu-center">센터</label><select class="sel" id="mu-center"></select></div>
        <div class="fld"><label class="req" for="mu-team">팀</label><select class="sel" id="mu-team"></select></div>
        <div class="fld"><label class="req" for="mu-role">역할</label><select class="sel" id="mu-role"></select></div>
        <div class="fld"><label class="req">계정 상태</label><div class="radio-row"><label><input type="radio" name="mu-st" value="사용" checked> 사용</label><label><input type="radio" name="mu-st" value="미사용"> 미사용</label></div></div>
      </div>
      <div class="err" id="mu-err"></div>
    </div>
    <div class="modal-actions"><button class="btn" data-close>취소</button><button class="btn pri" id="mu-ok" disabled>등록</button></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
UI.page(function () {
  var $ = UI.$, $$ = UI.$$, esc = UI.esc;
  var users = MOCK.load('users', MOCK.USERS), roles = MOCK.load('roles', MOCK.ROLES);
  var bar = $('#filters');
  $('#f-role').dataset.options = roles.map(function (r) { return r.name; }).join('|');
  UI.initMs(bar);
  UI.linkCenterTeam($('#f-center'), $('#f-team'));
  var tbl = $('#tbl'), tb = tbl.tBodies[0], ctl = null, editing = null;
  var ST = { '사용': 'ok', '잠금': 'fail', '미사용': 'st-none' };

  function search() {
    var c = UI.msValue($('#f-center')), t = UI.msValue($('#f-team')), r = UI.msValue($('#f-role')), s = UI.msValue($('#f-st')), q = $('#f-q').value.trim();
    var list = users.filter(function (u) {
      return (!c.length || c.indexOf(u.center) >= 0) && (!t.length || t.indexOf(u.team) >= 0) && (!r.length || r.indexOf(u.role) >= 0) && (!s.length || s.indexOf(u.st) >= 0) &&
        (!q || u.emp.indexOf(q) >= 0 || u.name.indexOf(q) >= 0);
    });
    tb.innerHTML = list.length ? list.map(function (u) {
      return '<tr><td>' + esc(u.emp) + '</td><td>' + esc(u.name) + (u.emp === UI.LOGIN.emp ? ' <span class="bdg secondary">본인</span>' : '') + '</td><td>' + esc(u.center) + '</td><td>' + esc(u.team) + '</td><td>' + esc(u.role) + '</td>' +
        '<td><span class="bdg ' + ST[u.st] + '">' + esc(u.st) + '</span></td><td>' + esc(u.last || '-') + '</td>' +
        '<td><button class="btn xs" data-edit="' + esc(u.emp) + '">수정</button>' + (u.st === '잠금' ? ' <button class="btn xs" data-unlock="' + esc(u.emp) + '">잠금 해제</button>' : '') + '</td></tr>';
    }).join('') : UI.emptyRow(8, '입력한 조건에 맞는 사용자가 없습니다.');
    if (ctl) ctl.refresh(); else ctl = UI.table(tbl, { sizeSel: $('#size'), pager: $('#pager'), totalEl: $('#total') });
  }
  $('#btn-search').addEventListener('click', search);
  $('#f-q').addEventListener('keydown', function (e) { if (e.key === 'Enter') search(); });
  $('#btn-reset').addEventListener('click', function () { ['#f-center', '#f-role', '#f-st'].forEach(function (s) { UI.setMsValue($(s), []); }); $('#f-center').dispatchEvent(new CustomEvent('ms-change')); UI.setMsValue($('#f-team'), []); $('#f-q').value = ''; search(); });

  function fillTeams(sel) { $('#mu-team').innerHTML = '<option value="">팀을 선택해 주세요.</option>' + (MOCK.CENTERS[$('#mu-center').value] || []).map(function (t) { return '<option' + (t === sel ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join(''); }
  $('#mu-center').addEventListener('change', function () { fillTeams(''); dirty(); });
  var snap = '';
  function state() { return [$('#mu-emp').value.trim(), $('#mu-name').value.trim(), $('#mu-center').value, $('#mu-team').value, $('#mu-role').value, $('input[name=mu-st]:checked').value].join('|'); }
  function dirty() {
    var ok = $('#mu-emp').value.trim() && $('#mu-name').value.trim() && $('#mu-center').value && $('#mu-team').value && $('#mu-role').value;
    $('#mu-ok').disabled = !ok || (editing && state() === snap); $('#mu-err').textContent = '';
  }
  ['#mu-emp', '#mu-name'].forEach(function (s) { $(s).addEventListener('input', dirty); });
  ['#mu-team', '#mu-role'].forEach(function (s) { $(s).addEventListener('change', dirty); });
  $$('input[name=mu-st]').forEach(function (r) { r.addEventListener('change', dirty); });
  function open(u) {
    editing = u || null;
    $('#mu-title').textContent = u ? '사용자 수정' : '사용자 등록'; $('#mu-ok').textContent = u ? '저장' : '등록';
    $('#mu-emp').value = u ? u.emp : ''; $('#mu-emp').disabled = !!u;
    $('#mu-name').value = u ? u.name : '';
    $('#mu-center').innerHTML = '<option value="">센터를 선택해 주세요.</option>' + Object.keys(MOCK.CENTERS).map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');
    $('#mu-center').value = u ? u.center : ''; fillTeams(u ? u.team : '');
    $('#mu-role').innerHTML = '<option value="">역할을 선택해 주세요.</option>' + roles.map(function (r) { return '<option>' + esc(r.name) + '</option>'; }).join('');
    $('#mu-role').value = u ? u.role : '';
    var stv = u ? (u.st === '잠금' ? '사용' : u.st) : '사용';
    $$('input[name=mu-st]').forEach(function (r) { r.checked = r.value === stv; });
    var self = !!(u && u.emp === UI.LOGIN.emp);
    $('#mu-self').hidden = !self; $('#mu-role').disabled = self; $$('input[name=mu-st]').forEach(function (r) { r.disabled = self; });
    snap = state(); dirty(); UI.openModal('m-user');
  }
  $('#add').addEventListener('click', function () { open(null); });
  $('#mu-ok').addEventListener('click', function () {
    var emp = $('#mu-emp').value.trim();
    if (!editing && users.some(function (u) { return u.emp === emp; })) { $('#mu-err').textContent = '이미 등록된 사번입니다.'; return; }
    var v = { name: $('#mu-name').value.trim(), center: $('#mu-center').value, team: $('#mu-team').value, role: $('#mu-role').value };
    var st = $('input[name=mu-st]:checked').value;
    if (editing) { Object.assign(editing, v); if (!(editing.st === '잠금' && st === '사용')) editing.st = st; }
    else users.push(Object.assign(v, { emp: emp, st: st, last: '' }));
    MOCK.save('users', users); UI.closeModal('m-user');
    UI.toast(editing ? '변경사항이 저장되었습니다.' : '사용자가 등록되었습니다.'); search();
  });
  tb.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var u = users.filter(function (x) { return x.emp === (b.dataset.edit || b.dataset.unlock); })[0]; if (!u) return;
    if (b.dataset.edit) open(u);
    if (b.dataset.unlock) UI.dialog({ title: '계정 잠금을 해제하시겠습니까?', ok: '해제', onOk: function () { u.st = '사용'; MOCK.save('users', users); UI.toast('계정 잠금이 해제되었습니다.'); search(); } });
  });
  search();
});
</script>
</body>
</html>
