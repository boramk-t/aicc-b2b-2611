<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>상담이력 상세</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body data-page="history-detail" data-title="상담이력 상세">
<div class="app">
  <div id="sidebar"></div>
  <div class="main">
    <div class="topbar"><div class="crumb">상담이력 조회 › <a id="crumb-list" href="history-list.html">상담이력</a> › <b>상담이력 상세</b></div></div>
    <div class="content">
      <div class="page-head">
        <h2>상담이력 상세</h2>
        <button class="btn" id="btn-back">목록으로</button>
      </div>

      <div class="card">
        <h3>콜 기본 정보</h3>
        <div class="meta-grid" id="meta"></div>
      </div>

      <div class="card" style="margin-top:14px">
        <h3>녹취 재생</h3>
        <div class="player">
          <button class="play" id="btn-play" aria-label="재생">▶</button>
          <div class="track" id="track"><div class="fill" id="fill"></div></div>
          <span class="time" id="time">00:00 / 00:00</span>
          <select class="sel" id="speed" aria-label="재생 속도"><option value="0.5">0.5x</option><option value="1" selected>1.0x</option><option value="1.5">1.5x</option><option value="2">2.0x</option></select>
          <button class="btn xs" id="btn-mute" aria-label="음소거">🔊</button>
          <input type="range" id="vol" min="0" max="100" value="80" aria-label="음량" style="width:90px">
        </div>
        <div class="player-legend"><span><i style="background:#94A3B8"></i>묵음 구간</span><span><i style="background:var(--red);border-radius:50%"></i>키워드 발생 위치</span><span>재생 속도 기본값 1.0x (확인 필요)</span></div>
      </div>

      <div class="detail-grid">
        <div class="card">
          <h3>전사 텍스트</h3>
          <div class="card-tools"><button class="btn xs" id="btn-follow" hidden>현재 재생 위치로</button></div>
          <div class="transcript" id="transcript"></div>
        </div>
        <div class="stack">
          <div class="card issue-panel" id="issue-panel" hidden></div>
          <div class="card">
            <h3>분류 결과</h3>
            <div id="cls"></div>
          </div>
          <div class="card">
            <h3>추출 키워드</h3>
            <div class="card-tools"><label class="hint" for="kwtype" style="margin:0">키워드 유형</label><select class="sel" id="kwtype"></select></div>
            <div class="kw-list" id="kwlist"></div>
          </div>
          <div class="card">
            <h3>이상 지표</h3>
            <div id="ind"></div>
            <div class="hint">판단 기준값은 확인 필요입니다. 프로토타입은 묵음 1분 이상, 통화 8분 초과, 이슈 키워드 1건 이상을 '주의'로 표시합니다.</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 이슈 유형 추가 -->
<div class="modal-overlay" id="m-type" hidden>
  <div class="modal md">
    <h3>이슈 유형 추가</h3>
    <div class="form">
      <div class="fld"><label class="req" for="t-name">이슈 유형명</label><input class="inp-s" id="t-name" placeholder="이슈 유형명을 입력해 주세요."><div class="err" id="t-err"></div></div>
      <div class="fld"><label for="t-desc">설명</label><input class="inp-s" id="t-desc"></div>
      <div class="fld"><label>사용 여부</label><div class="radio-row"><label><input type="radio" name="t-use" value="1" checked> 사용</label><label><input type="radio" name="t-use" value="0"> 사용 안 함</label></div></div>
    </div>
    <div class="modal-actions"><button class="btn" data-close>취소</button><button class="btn pri" id="t-ok" disabled>추가</button></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
UI.page(function () {
  var $ = UI.$, $$ = UI.$$, esc = UI.esc;
  var id = UI.params.get('id') || 'CL-20261107-0031';
  var from = UI.params.get('from') === 'issue' ? 'issue' : 'history';
  var listHref = from === 'issue' ? 'issue-list.html' : 'history-list.html';
  $('#crumb-list').href = listHref; $('#crumb-list').textContent = from === 'issue' ? '이슈 콜 목록' : '상담이력';
  $('#btn-back').addEventListener('click', function () { UI.markRestore(from); location.href = listHref; });

  var c = MOCK.CALLS.filter(function (x) { return x.id === id; })[0] || MOCK.CALLS[1];
  var kwAll = c.kws.concat(c.issueKws.map(function (k) { return { t: '이슈', k: k }; }));

  /* ---- 전사 (CL-20261107-0031은 수작업 샘플, 그 밖의 콜은 키워드로 만든 샘플) ---- */
  function buildTranscript() {
    if (c.id === 'CL-20261107-0031') return MOCK.TRANSCRIPT.utts.map(function (u) { return Object.assign({}, u, u.text ? { text: u.text.replace('{AGENT}', c.agent) } : {}); });
    var small = (c.type || '').split(' > ').pop();
    var u = [
      { s: 0, who: 'agent', text: '안녕하세요, 대신증권 고객센터 상담사 ' + c.agent + '입니다. 무엇을 도와드릴까요?' },
      { s: 7, who: 'cust', text: small + ' 관련해서 문의드리려고요.' },
      { s: 15, who: 'agent', text: '네, 고객님. 확인해 드리겠습니다.' },
      { silence: [21, 21 + Math.min(40, Math.round(UI.toSec(c.sil) / 2) || 12)] }
    ];
    var t = u[3].silence[1];
    kwAll.forEach(function (k, i) {
      var line = k.t === '이슈' ? '이 문제는 ' + k.k + ' 건으로 꼭 기록해 주세요.' : (i % 2 ? '네, ' + k.k + ' 내용을 안내해 드리겠습니다.' : k.k + ' 관련해서 다시 확인해 주실 수 있나요?');
      u.push({ s: t, who: k.t === '이슈' || i % 2 === 0 ? 'cust' : 'agent', text: line }); t += 12;
    });
    u.push({ s: t, who: 'agent', text: '더 궁금하신 점 있으시면 언제든 연락 주세요. 감사합니다.' });
    return u;
  }
  var utts = c.analyzing ? [] : buildTranscript();
  var LEN = Math.max(UI.toSec(c.dur), 60);
  var silences = utts.filter(function (u) { return u.silence; }).map(function (u) { return u.silence; });
  var speech = utts.filter(function (u) { return !u.silence; });

  /* ---- 키워드 유형 드롭다운 ---- */
  var typeSel = $('#kwtype');
  typeSel.innerHTML = ['전체'].concat(MOCK.KW_TYPES).map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('');
  function visibleKws() { var t = typeSel.value; return t === '전체' ? kwAll : kwAll.filter(function (k) { return k.t === t; }); }
  function occ(k) { return speech.filter(function (u) { return u.text.indexOf(k) >= 0; }).map(function (u) { return u.s; }); }

  /* ---- 콜 기본 정보 ---- */
  function renderMeta() {
    var vk = visibleKws();
    var cells = [
      ['콜 ID', esc(c.id)], ['일시', esc(c.dt)], ['센터', esc(c.center)], ['팀', esc(c.team)], ['사번', esc(c.emp)], ['상담사', esc(c.agent)],
      ['상담유형', c.analyzing ? '<span class="bdg secondary">분석 중</span>' : esc(c.type)], ['통화시간', esc(c.dur)],
      ['I/B·O/B', '<span class="bdg ' + (c.dir === 'I/B' ? 'ib' : 'ob') + '">' + esc(c.dir) + '</span>'],
      ['묵음시간', c.analyzing ? '<span class="bdg secondary">분석 중</span>' : esc(c.sil)], ['재인입', c.re ? '<span class="bdg re">재인입</span>' : '-']
    ];
    var h = cells.map(function (x, i) { return '<div class="mi' + (i === 6 ? ' span2' : '') + '"><span class="mk">' + x[0] + '</span><span class="mv">' + x[1] + '</span></div>'; }).join('');
    h += '<div class="mi wide"><span class="mk">키워드 (키워드 유형: ' + esc(typeSel.value) + ')</span><span class="mv">' + (c.analyzing ? '<span class="bdg secondary">분석 중</span>' : (vk.length ? vk.map(UI.kwChip).join('') : '-')) + '</span></div>';
    $('#meta').innerHTML = h;
  }

  /* ---- 전사 텍스트 ---- */
  function hl(text) {
    var h = esc(text);
    visibleKws().forEach(function (k) { var e = esc(k.k); h = h.split(e).join('<mark class="' + UI.kwClass(k.t) + '">' + e + '</mark>'); });
    return h;
  }
  function renderTranscript() {
    var box = $('#transcript');
    if (c.analyzing) { box.innerHTML = '<div class="hint" style="padding:20px;text-align:center">전사 텍스트를 준비 중입니다.</div>'; return; }
    box.innerHTML = utts.map(function (u, i) {
      if (u.silence) return '<div class="silence">묵음 ' + UI.mmss(u.silence[1] - u.silence[0]) + '</div>';
      return '<div class="utt" data-i="' + i + '" data-s="' + u.s + '"><span class="who ' + u.who + '">' + (u.who === 'agent' ? '상담사' : '고객') + '</span><span class="ts">' + UI.mmss(u.s) + '</span><span>' + hl(u.text) + '</span></div>';
    }).join('');
    markCurrent(true);
  }

  /* ---- 분류 결과 ---- */
  function renderCls() {
    if (c.analyzing) { $('#cls').innerHTML = '<div class="hint">분류 결과가 없습니다.</div>'; return; }
    var p = c.type.split(' > ');
    $('#cls').innerHTML = '<table class="cls-table">' + ['대분류', '중분류', '소분류', '세분류'].map(function (l, i) { return '<tr><th>' + l + '</th><td>' + esc(p[i] || '-') + '</td></tr>'; }).join('') + '</table>';
  }

  /* ---- 추출 키워드 ---- */
  function renderKws() {
    var box = $('#kwlist');
    if (c.analyzing) { box.innerHTML = '<div class="hint">추출된 키워드가 없습니다.</div>'; return; }
    var list = visibleKws().map(function (k) { return { k: k, ts: occ(k.k) }; }).sort(function (a, b) { return b.ts.length - a.ts.length; });
    if (!kwAll.length) { box.innerHTML = '<div class="hint">추출된 키워드가 없습니다.</div>'; return; }
    if (!list.length) { box.innerHTML = '<div class="hint">선택한 유형에 해당하는 키워드가 없습니다.</div>'; return; }
    box.innerHTML = list.map(function (x) {
      return '<div class="kw-row">' + '<a style="cursor:pointer" data-seek="' + (x.ts[0] != null ? x.ts[0] : '') + '">' + UI.kwChip(x.k) + '</a>' +
        '<span class="hint" style="margin:0">' + esc(x.k.t === '이슈' ? '이슈 키워드' : x.k.t) + '</span><span class="cnt">' + x.ts.length + '회</span>' +
        '<span class="tss">' + x.ts.map(function (s) { return '<a data-seek="' + s + '">' + UI.mmss(s) + '</a>'; }).join('') + '</span></div>';
    }).join('');
  }

  /* ---- 이상 지표 ---- */
  function renderInd() {
    if (c.analyzing) { $('#ind').innerHTML = '<div class="hint">감지된 이상 지표가 없습니다.</div>'; return; }
    var warn = '<span class="bdg warn">주의</span>';
    var longest = silences.slice().sort(function (a, b) { return (b[1] - b[0]) - (a[1] - a[0]); })[0];
    var issue = kwAll.filter(function (k) { return k.t === '이슈'; });
    var rows = [
      ['묵음', '총 ' + esc(c.sil) + ' · 구간 ' + silences.length + '개' + (longest ? ' · 최장 ' + UI.mmss(longest[1] - longest[0]) + ' (<a data-seek="' + longest[0] + '">' + UI.mmss(longest[0]) + '</a>)' : ''), UI.toSec(c.sil) >= 60],
      ['재인입', c.re ? '재인입 · 직전 콜 CL-' + c.dt.slice(0, 10).replace(/\./g, '') + '-0007 (' + UI.addDays(c.dt.slice(0, 10), -1) + ' 17:22:10)' : '해당 없음', c.re],
      ['통화시간', esc(c.dur) + (UI.toSec(c.dur) > 480 ? ' · 기준(8분) 초과' : ' · 기준 이내'), UI.toSec(c.dur) > 480],
      ['이슈 키워드', issue.length ? issue.length + '건 · ' + issue.map(function (k) { var t = occ(k.k)[0]; return esc(k.k) + (t != null ? ' (<a data-seek="' + t + '">' + UI.mmss(t) + '</a>)' : ''); }).join(', ') : '감지 없음', issue.length > 0]
    ];
    var any = rows.some(function (r) { return r[2]; });
    $('#ind').innerHTML = rows.map(function (r) { return '<div class="ind-row"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span>' + (r[2] ? warn : '<span></span>') + '</div>'; }).join('') +
      (any ? '' : '<div class="hint">감지된 이상 지표가 없습니다.</div>');
  }

  /* ---- 녹취 재생 ---- */
  var cur = 0, playing = false, timer = null, follow = true, lastIdx = -1;
  function renderTrack() {
    var tr = $('#track');
    $$('.mk-s, .mk-k', tr).forEach(function (m) { m.remove(); });
    silences.forEach(function (s) { tr.insertAdjacentHTML('beforeend', '<span class="mk-s" title="묵음 ' + UI.mmss(s[0]) + '~' + UI.mmss(s[1]) + '" style="left:' + (s[0] / LEN * 100) + '%;width:' + Math.max(0.6, (s[1] - s[0]) / LEN * 100) + '%"></span>'); });
    visibleKws().forEach(function (k) { occ(k.k).forEach(function (t) { tr.insertAdjacentHTML('beforeend', '<span class="mk-k" title="' + esc(k.k) + ' ' + UI.mmss(t) + '" style="left:' + (t / LEN * 100) + '%"></span>'); }); });
  }
  function setTime(t) {
    cur = Math.max(0, Math.min(LEN, t));
    $('#fill').style.width = (cur / LEN * 100) + '%';
    $('#time').textContent = UI.mmss(cur) + ' / ' + UI.mmss(LEN);
    markCurrent(false);
  }
  function markCurrent(force) {
    var idx = -1;
    speech.forEach(function (u) { if (u.s <= cur) idx = utts.indexOf(u); });
    if (idx === lastIdx && !force) return;
    lastIdx = idx;
    $$('.utt').forEach(function (el) { el.classList.toggle('on', +el.dataset.i === idx); });
    if (playing && follow) scrollToCurrent();
  }
  function scrollToCurrent() {
    var el = $('.utt.on'), box = $('#transcript');
    if (el) box.scrollTop = el.offsetTop - box.offsetTop - 40;
  }
  function play(on) {
    playing = on;
    $('#btn-play').textContent = on ? '❚❚' : '▶';
    $('#btn-play').setAttribute('aria-label', on ? '일시정지' : '재생');
    clearInterval(timer);
    if (on) timer = setInterval(function () { setTime(cur + 0.25 * +$('#speed').value); if (cur >= LEN) play(false); }, 250);
  }
  function seek(t, autoplay) { setTime(t); follow = true; $('#btn-follow').hidden = true; scrollToCurrent(); if (autoplay) play(true); }
  $('#btn-play').addEventListener('click', function () { if (c.analyzing) return; play(!playing); });
  var dragging = false;
  function trackPos(e) { var r = $('#track').getBoundingClientRect(); return (e.clientX - r.left) / r.width * LEN; }
  $('#track').addEventListener('mousedown', function (e) { dragging = true; setTime(trackPos(e)); });
  document.addEventListener('mousemove', function (e) { if (dragging) setTime(trackPos(e)); });
  document.addEventListener('mouseup', function () { dragging = false; });
  $('#btn-mute').addEventListener('click', function () { var m = this.textContent === '🔊'; this.textContent = m ? '🔇' : '🔊'; this.setAttribute('aria-label', m ? '음소거 해제' : '음소거'); });
  $('#transcript').addEventListener('wheel', function () { if (playing) { follow = false; $('#btn-follow').hidden = false; } });
  $('#btn-follow').addEventListener('click', function () { follow = true; this.hidden = true; scrollToCurrent(); });
  document.addEventListener('click', function (e) {
    var u = e.target.closest('.utt');
    if (u) { seek(+u.dataset.s, true); return; }
    var s = e.target.closest('[data-seek]');
    if (s && s.dataset.seek !== '') seek(+s.dataset.seek, true);
  });

  typeSel.addEventListener('change', function () { renderMeta(); renderTranscript(); renderKws(); renderTrack(); });

  /* ---- 이슈 처리 ---- */
  var issue = MOCK.issues().filter(function (x) { return x.id === c.id; })[0];
  var canEdit = UI.canEdit;
  var canAddType = UI.isLeader && UI.canEdit;
  function ownerOptions(itype, sel) {
    var os = MOCK.owners().slice().sort(function (a, b) {
      var ma = !a.types.length || a.types.indexOf(itype) >= 0, mb = !b.types.length || b.types.indexOf(itype) >= 0;
      return (mb ? 1 : 0) - (ma ? 1 : 0);
    });
    return '<option value="">미지정</option>' + os.map(function (o) {
      var m = itype && o.types.indexOf(itype) >= 0;
      return '<option value="' + esc(o.name) + '"' + (o.name === sel ? ' selected' : '') + '>' + esc(o.name) + (m ? ' (담당 유형)' : '') + '</option>';
    }).join('');
  }
  function typeOptions(sel) {
    var ts = MOCK.issueTypes();
    var h = '<option value="">미지정</option>' + ts.filter(function (t) { return t.use || t.name === sel; }).map(function (t) { return '<option' + (t.name === sel ? ' selected' : '') + '>' + esc(t.name) + '</option>'; }).join('');
    if (canAddType) h += '<option value="__add">+ 이슈 유형 추가</option>';
    return h;
  }
  function renderIssue() {
    var p = $('#issue-panel');
    if (!issue) { p.hidden = true; return; }
    p.hidden = false;
    issue = MOCK.issues().filter(function (x) { return x.id === c.id; })[0];
    var dis = canEdit ? '' : ' disabled';
    var due = UI.dueDate(issue.reg, issue.due);
    p.innerHTML =
      '<h3>이슈 처리 ' + UI.stBadge(issue.status) + (UI.isOverdue(issue) ? ' <span class="bdg over">기한 초과</span>' : '') + '</h3>' +
      (canEdit ? '' : '<div class="banner info" style="margin-bottom:10px">편집 권한이 없어 읽기 전용으로 표시합니다.</div>') +
      '<div class="issue-form">' +
        '<div class="fld"><label for="i-st">상태</label><select class="sel" id="i-st"' + dis + '>' + UI.STATUSES.map(function (s) { return '<option' + (s === issue.status ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></div>' +
        '<div class="fld"><label for="i-due">이슈 기한</label><div class="inline"><select class="sel" id="i-due" style="width:80px"' + dis + '>' + UI.DUE_UNITS.map(function (u) { return '<option' + (u === issue.due ? ' selected' : '') + '>' + u + '</option>'; }).join('') + '</select><span id="i-duedate" class="hint" style="margin:0">기한일 ' + due + '</span></div></div>' +
        '<div class="fld"><label for="i-type">이슈 유형</label><select class="sel" id="i-type"' + dis + '>' + typeOptions(issue.itype) + '</select></div>' +
        '<div class="fld"><label for="i-owner">담당 관리자</label><select class="sel" id="i-owner"' + dis + '>' + ownerOptions(issue.itype, issue.owner) + '</select></div>' +
        '<div class="fld full"><label>개선 제안</label><div class="suggest" id="i-sg"></div></div>' +
        '<div class="fld full"><label for="i-memo">처리 내용</label><textarea class="ta" id="i-memo" placeholder="처리 내용을 입력해 주세요."' + dis + '></textarea><div class="err" id="i-err"></div><div class="hint">상태를 \'처리완료\'·\'이슈없음\'으로 바꿀 때 필수 (제안)</div></div>' +
        '<div class="fld"><label>등록일</label><span class="mv">' + issue.reg + '</span></div>' +
        '<div class="fld"><label>처리 완료일</label><span class="mv">' + (issue.done || '-') + '</span></div>' +
      '</div>' +
      (canEdit ? '<div class="filter-actions"><button class="btn pri" id="i-save" disabled>저장</button></div>' : '') +
      '<div style="margin-top:12px;font-size:13px;font-weight:700">처리 내역</div><div class="timeline" id="i-tl"></div>';
    renderSuggest(issue.itype);
    renderTimeline();
    if (!canEdit) return;
    var ctrls = ['#i-st', '#i-due', '#i-type', '#i-owner', '#i-memo'];
    ctrls.forEach(function (s) { $(s).addEventListener('input', dirty); $(s).addEventListener('change', dirty); });
    $('#i-due').addEventListener('change', function () { $('#i-duedate').textContent = '기한일 ' + UI.dueDate(issue.reg, this.value); });
    $('#i-type').addEventListener('change', function () {
      if (this.value === '__add') { this.value = issue.itype; openTypeModal(); return; }
      renderSuggest(this.value);
      $('#i-owner').innerHTML = ownerOptions(this.value, $('#i-owner').value);
    });
    $('#i-save').addEventListener('click', saveIssue);
  }
  function dirty() {
    var ch = $('#i-st').value !== issue.status || $('#i-due').value !== issue.due || $('#i-type').value !== issue.itype || $('#i-owner').value !== issue.owner || $('#i-memo').value.trim() !== '';
    $('#i-save').disabled = !ch; $('#i-err').textContent = '';
  }
  function renderSuggest(itype) {
    var box = $('#i-sg');
    if (!itype) { box.innerHTML = '<div class="hint" style="margin:0">이슈 유형을 선택하면 개선 제안을 볼 수 있습니다.</div>'; return; }
    var list = MOCK.load('suggestions', MOCK.SUGGESTIONS).filter(function (s) { return s.type === itype && s.use; });
    box.innerHTML = list.length ? list.map(function (s, i) { return '<div class="sg"><span>' + esc(s.text) + '</span>' + (canEdit ? '<button class="btn xs" data-sg="' + i + '">처리 내용에 넣기</button>' : '') + '</div>'; }).join('')
      : '<div class="hint" style="margin:0">이 이슈 유형에 등록된 개선 제안이 없습니다.</div>';
    $$('[data-sg]', box).forEach(function (b) {
      b.addEventListener('click', function () { var m = $('#i-memo'); m.value = (m.value ? m.value + '\n' : '') + list[+b.dataset.sg].text; dirty(); });
    });
  }
  function renderTimeline() {
    var list = MOCK.history(c.id).slice().reverse();
    if (!list.length) list = [{ t: issue.reg + ' 00:00:00', w: '시스템', c: '이슈 콜 등록 (이슈 키워드: ' + c.issueKws.join(', ') + ')' }];
    $('#i-tl').innerHTML = list.map(function (h) { return '<div class="tl"><span class="t">' + esc(h.t) + '</span><span class="w">' + esc(h.w) + '</span><span>' + esc(h.c) + '</span></div>'; }).join('');
  }
  function saveIssue() {
    var st = $('#i-st').value, due = $('#i-due').value, it = $('#i-type').value, ow = $('#i-owner').value, memo = $('#i-memo').value.trim();
    var closed = st === '처리완료' || st === '이슈없음';
    if (closed && st !== issue.status && !memo) { $('#i-err').textContent = '처리 내용을 입력해 주세요.'; return; }
    var ch = [];
    if (st !== issue.status) ch.push('상태 변경: ' + issue.status + ' → ' + st);
    if (due !== issue.due) ch.push('이슈 기한 변경: ' + issue.due + ' → ' + due);
    if (it !== issue.itype) ch.push('이슈 유형 ' + (issue.itype ? '변경: ' + issue.itype + ' → ' : '지정: ') + (it || '미지정'));
    if (ow !== issue.owner) ch.push('담당 관리자 ' + (issue.owner ? '변경: ' + issue.owner + ' → ' : '지정: ') + (ow || '미지정'));
    if (memo) ch.push('처리 내용: ' + memo);
    var done = closed ? (UI.isOpen(issue.status) || !issue.done ? UI.TODAY : issue.done) : '';
    MOCK.saveIssue(c.id, { status: st, due: due, itype: it, owner: ow, done: done });
    MOCK.addHistory(c.id, { t: MOCK.NOW, w: UI.LOGIN.name + '(' + UI.LOGIN.emp + ')', c: ch.join(' · ') });
    UI.toast('변경사항이 저장되었습니다.');
    renderIssue();
  }
  function openTypeModal() {
    $('#t-name').value = ''; $('#t-desc').value = ''; $('#t-err').textContent = ''; $('#t-ok').disabled = true;
    UI.openModal('m-type');
  }
  $('#t-name').addEventListener('input', function () { $('#t-ok').disabled = !this.value.trim(); $('#t-err').textContent = ''; });
  $('#t-ok').addEventListener('click', function () {
    var name = $('#t-name').value.trim(), ts = MOCK.issueTypes();
    if (ts.some(function (t) { return t.name === name; })) { $('#t-err').textContent = '이미 있는 이슈 유형명입니다.'; return; }
    ts.push({ name: name, desc: $('#t-desc').value.trim(), use: UI.$('input[name=t-use]:checked').value === '1', mod: '-' });
    MOCK.save('issueTypes', ts);
    UI.closeModal('m-type');
    UI.toast('이슈 유형이 추가되었습니다.');
    var sel = $('#i-type'); sel.innerHTML = typeOptions(name); sel.value = name; renderSuggest(name);
    $('#i-owner').innerHTML = ownerOptions(name, $('#i-owner').value); dirty();
  });

  renderMeta(); renderTranscript(); renderCls(); renderKws(); renderInd(); renderTrack(); setTime(0); renderIssue();
});
</script>
</body>
</html>
