<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>공지사항</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body data-page="notice" data-title="공지사항">
<div class="app">
  <div id="sidebar"></div>
  <div class="main">
    <div class="topbar"><div class="crumb"><b>공지사항</b></div></div>
    <div class="content">
      <div class="page-head"><h2>공지사항</h2></div>
      <div class="filter-bar">
        <div class="filter-grid c3">
          <div class="fld"><label for="f-cat">구분</label><select class="sel" id="f-cat"><option value="">전체</option><option>중요</option><option>일반</option></select></div>
          <div class="fld span2"><label for="f-q">제목</label><div class="inline"><input class="inp-s grow" id="f-q" placeholder="제목 입력 (부분 일치)"><button class="btn pri" id="btn-search">검색</button></div></div>
        </div>
      </div>
      <div class="list-wrap">
        <div class="list-head">
          <div class="left"><b id="total" style="color:#0F172A">총 0건</b><span>'중요' 공지는 목록 맨 위에 표시합니다. (확인 필요)</span></div>
          <div class="right"><a class="btn xs pri admin-only" href="notice-form.html">공지 등록</a><label class="hint" for="size" style="margin:0 0 0 8px">페이지 크기</label><select class="sel" id="size"><option>10</option><option selected>20</option><option>50</option></select></div>
        </div>
        <table class="data" id="tbl">
          <thead><tr><th>구분</th><th>제목</th><th>등록자</th><th>등록일</th></tr></thead>
          <tbody></tbody>
        </table>
        <div class="pager" id="pager"></div>
      </div>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
UI.page(function () {
  var $ = UI.$, esc = UI.esc, ctl = null;
  var tbl = $('#tbl'), tb = tbl.tBodies[0];
  function search() {
    var all = MOCK.load('notices', MOCK.NOTICES), cat = $('#f-cat').value, q = $('#f-q').value.trim();
    var list = all.filter(function (x) { return (!cat || x.cat === cat) && (!q || x.title.indexOf(q) >= 0); })
      .sort(function (a, b) { return (a.cat === '중요' ? 0 : 1) - (b.cat === '중요' ? 0 : 1) || (a.reg < b.reg ? 1 : a.reg > b.reg ? -1 : 0); });
    tb.innerHTML = list.length ? list.map(function (x) {
      return '<tr class="clickable" data-id="' + esc(x.id) + '"><td><span class="bdg ' + (x.cat === '중요' ? 'default' : 'outline') + '">' + esc(x.cat) + '</span></td>' +
        '<td><a class="lnk ellipsis w280" style="max-width:520px" href="notice-detail.html?id=' + encodeURIComponent(x.id) + '">' + esc(x.title) + '</a></td><td>' + esc(x.by) + '</td><td>' + esc(x.reg) + '</td></tr>';
    }).join('') : UI.emptyRow(4, all.length ? '입력한 조건과 일치하는 공지사항이 없습니다.' : '등록된 공지사항이 없습니다.');
    if (ctl) ctl.refresh(); else ctl = UI.table(tbl, { sizeSel: $('#size'), pager: $('#pager'), totalEl: $('#total') });
  }
  tb.addEventListener('click', function (e) { var tr = e.target.closest('tr[data-id]'); if (tr && !UI.interactive(e.target)) location.href = 'notice-detail.html?id=' + encodeURIComponent(tr.dataset.id); });
  $('#btn-search').addEventListener('click', search);
  $('#f-q').addEventListener('keydown', function (e) { if (e.key === 'Enter') search(); });
  search();
});
</script>
</body>
</html>
