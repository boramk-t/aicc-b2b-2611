<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>콜 통계</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body data-page="stats" data-title="콜 통계">
<div class="app">
  <div id="sidebar"></div>
  <div class="main">
    <div class="topbar"><div class="crumb"><b>콜 통계</b></div></div>
    <div class="content">
      <div class="page-head">
        <h2>콜 통계</h2>
        <span class="hint" style="margin:0">집계 기준 일시 2026.11.07 15:00:00 (데이터 갱신 주기 확인 필요)</span>
      </div>

      <div class="filter-bar" id="filters">
        <div class="filter-grid">
          <div class="fld span2"><label>기간</label><div id="f-period"></div></div>
          <div class="fld"><label>센터</label><div class="ms" id="f-center" data-options="서울센터|부산센터"></div></div>
          <div class="fld"><label>팀</label><div class="ms" id="f-team" data-options=""></div></div>
        </div>
        <div class="filter-err"></div>
        <div class="filter-actions"><button class="btn" id="btn-reset">초기화</button><button class="btn pri" id="btn-search">검색</button></div>
      </div>

      <div class="kpi-grid" id="kpi"></div>

      <div class="card">
        <h3>통계 표</h3>
        <div class="card-tools"><label class="hint" for="unit" style="margin:0">집계 단위</label><select class="sel" id="unit"><option value="date">일자별</option><option value="center">센터별</option><option value="team">팀별</option></select></div>
        <div id="t-main"></div>
      </div>

      <div class="card" style="margin-top:14px">
        <h3>이슈 콜 처리 현황</h3>
        <div class="report-note">이슈 콜 목록의 상태·이슈 기한·이슈 유형·담당 관리자·처리 완료일을 집계합니다. 상태는 조회 시점의 현재 상태 기준입니다. (확인 필요)</div>
        <div class="kpi-grid c9" id="ikpi"></div>
        <div class="inline" style="margin:4px 0 10px; gap:10px">
          <label class="hint" for="iby" style="margin:0">집계 기준</label>
          <select class="sel" id="iby" style="width:140px"><option value="period">기간별</option><option value="type">이슈 유형별</option><option value="owner">담당 관리자별</option></select>
          <span id="iunit-wrap" class="inline"><label class="hint" for="iunit" style="margin:0">집계 단위</label><select class="sel" id="iunit" style="width:90px"><option>일</option><option>주</option><option>월</option><option>연</option></select></span>
        </div>
        <div id="t-issue"></div>
      </div>
      <div class="proto-note">목업 데이터: 2026.09.09~2026.11.07 합성 통계입니다. 통화 일시가 조회 기간에 포함된 콜을 집계합니다.</div>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
UI.page(function () {
  var $ = UI.$, esc = UI.esc, n = UI.n;
  var bar = $('#filters');
  $('#f-period').innerHTML = UI.drHtml();
  UI.initMs(bar);
  UI.linkCenterTeam($('#f-center'), $('#f-team'));
  var dr = UI.dateRange($('[data-dr]', bar), 6);
  var S = MOCK.stats();
  var cur = null;

  function cnt(v) { return n(v) + '건'; }
  function pct(a, b) { return b ? (Math.round(a / b * 1000) / 10).toFixed(1) + '%' : '-'; }
  function avgT(sum, k) { return k ? UI.hms(sum / k) : '-'; }
  function avgD(sum, k) { return k ? (Math.round(sum / k * 10) / 10).toFixed(1) + '일' : '-'; }

  function filters() {
    var err = dr.check(); UI.showErr(bar, err); if (err) return null;
    var p = dr.get();
    return { from: p[0], to: p[1], centers: UI.msValue($('#f-center')), teams: UI.msValue($('#f-team')) };
  }
  function pick(rec, f) {
    if (rec.date < f.from || rec.date > f.to) return false;
    if (f.centers.length && f.centers.indexOf(rec.center) < 0) return false;
    if (f.teams.length && f.teams.indexOf(rec.team) < 0) return false;
    return true;
  }
  function agg(rows) {
    var a = { calls: 0, re: 0, issue: 0, dur: 0, sil: 0 };
    rows.forEach(function (r) { a.calls += r.calls; a.re += r.re; a.issue += r.issue; a.dur += r.dur; a.sil += r.sil; });
    return a;
  }
  function kpi(lab, val, cls) { return '<div class="kpi ' + (cls || '') + '"><div class="lab">' + lab + '</div><div class="val">' + val + '</div></div>'; }

  /* ---- 콜 통계 ---- */
  function renderMain() {
    var f = cur, rows = S.days.filter(function (r) { return pick(r, f); }), tot = agg(rows);
    $('#kpi').innerHTML = kpi('전체 콜', cnt(tot.calls)) + kpi('재인입 콜', cnt(tot.re)) + kpi('이슈 콜', cnt(tot.issue)) +
      kpi('평균 통화시간', avgT(tot.dur, tot.calls)) + kpi('평균 묵음시간', avgT(tot.sil, tot.calls));
    var unit = $('#unit').value, groups = {}, keys = [];
    if (unit === 'date') { for (var d = f.from; d <= f.to; d = UI.addDays(d, 1)) { groups[d] = []; keys.push(d); } }
    rows.forEach(function (r) {
      var k = unit === 'date' ? r.date : unit === 'center' ? r.center : r.center + ' · ' + r.team;
      if (!groups[k]) { groups[k] = []; keys.push(k); }
      groups[k].push(r);
    });
    function tr(label, a, cls) {
      return '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td>' + esc(label) + '</td><td>' + cnt(a.calls) + '</td><td>' + cnt(a.re) + '</td><td>' + cnt(a.issue) + '</td><td>' + avgT(a.dur, a.calls) + '</td><td>' + avgT(a.sil, a.calls) + '</td></tr>';
    }
    var head = unit === 'date' ? '일자' : unit === 'center' ? '센터' : '센터 · 팀';
    $('#t-main').innerHTML = '<table class="data" id="tm"><thead><tr><th class="sortable" data-default="' + (unit === 'date' ? 'desc' : 'asc') + '">' + head + '</th><th class="sortable">전체 콜</th><th class="sortable">재인입 콜</th><th class="sortable">이슈 콜</th><th class="sortable">평균 통화시간</th><th class="sortable">평균 묵음시간</th></tr></thead><tbody>' +
      (tot.calls || unit === 'date' ? tr('합계', tot, 'sum-row-tr') + keys.map(function (k) { return tr(k, agg(groups[k])); }).join('') : UI.emptyRow(6, '선택한 조건에 해당하는 콜이 없습니다.')) + '</tbody></table>';
    UI.table($('#tm'), { noPaging: true });
  }

  /* ---- 이슈 콜 처리 현황 ---- */
  function periodKey(d, u, f) {
    var s, e, x = UI.parseD(d);
    if (u === '일') return [d, d];
    if (u === '주') { var back = (x.getDay() + 6) % 7; s = UI.addDays(d, -back); e = UI.addDays(s, 6); }
    if (u === '월') { s = d.slice(0, 8) + '01'; e = UI.dueDate(d, '월'); }
    if (u === '연') { s = d.slice(0, 4) + '.01.01'; e = d.slice(0, 4) + '.12.31'; }
    return [s < f.from ? f.from : s, e > f.to ? f.to : e];
  }
  function iagg(list) {
    var a = { all: list.length, '미처리': 0, '검토필요': 0, '처리완료': 0, '이슈없음': 0, closed: 0, days: 0, over: 0, intime: 0 };
    list.forEach(function (r) {
      a[r.status]++;
      var due = UI.dueDate(r.date, r.due);
      if (r.done) { a.closed++; a.days += UI.diffDays(r.date, r.done); if (r.done <= due) a.intime++; }
      else if (UI.TODAY > due) a.over++;
    });
    return a;
  }
  function renderIssue() {
    var f = cur, list = S.issues.filter(function (r) { return pick(r, f); }), t = iagg(list);
    var c = function (lab, val, cls) { return kpi(lab, val, cls); };
    $('#ikpi').innerHTML = c('미처리', cnt(t['미처리']), 'k-open') + c('검토필요', cnt(t['검토필요']), 'k-review') + c('처리완료', cnt(t['처리완료']), 'k-done') + c('이슈없음', cnt(t['이슈없음']), 'k-none') +
      c('확정 이슈 콜', cnt(t.all - t['이슈없음'])) + c('처리율', pct(t.closed, t.all)) + c('평균 처리 기간', avgD(t.days, t.closed)) + c('기한 초과', cnt(t.over), 'k-over') + c('기한 내 처리율', pct(t.intime, t.closed));
    var by = $('#iby').value, u = $('#iunit').value;
    $('#iunit-wrap').hidden = by !== 'period';
    var groups = {}, keys = [];
    function put(k, r) { if (!groups[k]) { groups[k] = []; keys.push(k); } if (r) groups[k].push(r); }
    function plabel(p) { return u === '일' ? p[0] : p[0] + ' ~ ' + p[1]; }
    if (by === 'period') { for (var d = f.from; d <= f.to; d = UI.addDays(d, 1)) put(plabel(periodKey(d, u, f))); }
    list.forEach(function (r) {
      var k;
      if (by === 'period') k = plabel(periodKey(r.date, u, f));
      else if (by === 'type') k = r.itype || '미지정'; else k = r.owner || '미지정';
      put(k, r);
    });
    function tr(label, a, cls) {
      return '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td>' + esc(label) + '</td><td>' + cnt(a.all) + '</td><td>' + cnt(a['미처리']) + '</td><td>' + cnt(a['검토필요']) + '</td><td>' + cnt(a['처리완료']) + '</td><td>' + cnt(a['이슈없음']) +
        '</td><td>' + pct(a.closed, a.all) + '</td><td>' + avgD(a.days, a.closed) + '</td><td>' + cnt(a.over) + '</td><td>' + pct(a.intime, a.closed) + '</td></tr>';
    }
    var head = by === 'period' ? '기간 (' + u + ')' : by === 'type' ? '이슈 유형' : '담당 관리자';
    var dflt = by === 'period' ? ' data-default="desc"' : '';
    $('#t-issue').innerHTML = '<table class="data" id="ti"><thead><tr><th class="sortable"' + dflt + '>' + head + '</th><th class="sortable"' + (by === 'period' ? '' : ' data-default="desc"') + '>이슈 콜</th><th class="sortable">미처리</th><th class="sortable">검토필요</th><th class="sortable">처리완료</th><th class="sortable">이슈없음</th><th class="sortable">처리율</th><th class="sortable">평균 처리 기간</th><th class="sortable">기한 초과</th><th class="sortable">기한 내 처리율</th></tr></thead><tbody>' +
      tr('합계', t, 'sum-row-tr') + keys.map(function (k) { return tr(k, iagg(groups[k])); }).join('') + '</tbody></table>';
    UI.table($('#ti'), { noPaging: true });
  }

  function search() { var f = filters(); if (!f) return; cur = f; renderMain(); renderIssue(); }
  $('#btn-search').addEventListener('click', search);
  $('#btn-reset').addEventListener('click', function () { dr.reset(); UI.setMsValue($('#f-center'), []); $('#f-center').dispatchEvent(new CustomEvent('ms-change')); UI.setMsValue($('#f-team'), []); search(); });
  $('#unit').addEventListener('change', function () { if (cur) renderMain(); });
  $('#iby').addEventListener('change', function () { if (cur) renderIssue(); });
  $('#iunit').addEventListener('change', function () { if (cur) renderIssue(); });
  search();
});
</script>
</body>
</html>
